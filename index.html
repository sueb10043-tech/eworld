<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>이월드 길잡이</title>
<meta name="theme-color" content="#2b2118">
<style>
:root{
  --bg:#f6f0e4; --ink:#2b2118; --sub:#6d5e4f; --line:#e3d7c3; --card:#fffdf8;
  --on:#1f8a4c; --on-bg:#e3f4ea; --off:#c4362c; --off-bg:#fbe5e2; --warn:#b26a00; --warn-bg:#fff1d6;
  --none:#7d7468; --none-bg:#eeeae3; --accent:#e4572e; --me:#1a73e8;
  --zD:#1e3a5f; --zF:#a8283a; --zA:#86397a; --zM:#c47424; --zT:#2a7d97; --zZ:#2f6b3a; --zG:#555;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif}
body{display:flex;flex-direction:column;height:100dvh;overflow:hidden}
button{font:inherit;color:inherit}

header{padding:10px 14px 8px;background:var(--ink);color:#fff8ec;flex:none;padding-top:calc(10px + env(safe-area-inset-top))}
.top{display:flex;align-items:center;gap:8px}
.top h1{font-size:18px;margin:0;font-weight:800;letter-spacing:-.3px}
.top h1 span{color:#ffb35c}
.live{margin-left:auto;font-size:11.5px;opacity:.9;display:flex;align-items:center;gap:6px;white-space:nowrap}
.live .dot{width:8px;height:8px;border-radius:50%;background:#888}
.live.ok .dot{background:#4fd18b}.live.err .dot{background:#ff6b5e}.live.loading .dot{background:#ffc94d}
.live button{background:#ffffff1f;border:0;border-radius:8px;padding:4px 8px;font-size:11.5px;color:#fff8ec}
.live #testBtn.on{background:#ffb35c;color:var(--ink);font-weight:800}
.tmi{display:flex;flex-direction:column;gap:8px}
.tmi button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px;text-align:left;font-size:15px;font-weight:800}
.tmi button small{display:block;font-weight:500;font-size:12.5px;color:var(--sub);margin-top:3px;line-height:1.45}
.tmi button.on{border:2px solid var(--ink)}
.search{margin-top:8px;display:flex;gap:6px}
.search input{flex:1;min-width:0;border:0;border-radius:12px;padding:11px 12px;font-size:16px;background:#fff8ec;color:var(--ink);outline:none}
.search button{border:0;border-radius:12px;padding:0 12px;background:#ffffff1f;color:#fff8ec;font-size:14px}
.chips{display:flex;gap:6px;overflow-x:auto;margin-top:8px;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid #ffffff33;background:transparent;color:#fff8ec;border-radius:999px;padding:5px 11px;font-size:13px}
.chip.on{background:#ffb35c;color:var(--ink);border-color:#ffb35c;font-weight:700}

/* 지도 */
#viewport{position:relative;flex:1;min-height:200px;overflow:hidden;background:#d6e6c4;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
#viewport.drag{cursor:grabbing}
#stage{position:absolute;left:0;top:0;transform-origin:0 0}
#stage svg{display:block;width:100%;height:100%}
#labels,#markers,#favs{position:absolute;inset:0;pointer-events:none}
.fv{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;border:0;background:none;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center}
.fv b{font-size:24px;line-height:1;text-shadow:0 0 2px #fff,0 0 2px #fff,0 0 3px #fff,0 1px 3px #0006}
.fv span{font-size:11.5px;font-weight:800;color:var(--ink);white-space:nowrap;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 2px #fff;margin-top:-1px}
#favPicker{position:fixed;inset:0;z-index:50;background:#0006;display:none;align-items:flex-end;justify-content:center}
.fpbox{background:var(--card);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.fpt{font-size:13px;color:var(--sub);font-weight:700}
.fpn{font-size:18px;font-weight:800;margin:2px 0 12px}
.fps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sw{border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 0 6px;font-size:28px;line-height:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.sw small{font-size:11.5px;color:var(--sub);font-weight:700}
.sw.on{border:2px solid var(--ink)}
.fpb{display:flex;gap:8px;margin-top:12px}
.fpb button{flex:1;border:0;border-radius:12px;padding:12px;font-weight:800;font-size:15px;background:#f1e9da}
.fpb .fpdel{background:var(--off-bg);color:var(--off)}
.cstar{flex:none;border:0;background:none;font-size:24px;line-height:1;padding:2px 0 0;color:#c9b99c;cursor:pointer;align-self:flex-start}
.zl{position:absolute;transform:translate(-50%,-50%);font-weight:900;font-size:15px;letter-spacing:-.3px;white-space:nowrap;
  color:#fff;padding:3px 9px;border-radius:999px;box-shadow:0 1px 4px #0004;opacity:.95}
.pl{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:3px;white-space:nowrap;font-size:11.5px;font-weight:700;
  color:var(--ink);text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 2px #fff}
.pl i{display:block;width:9px;height:9px;border-radius:50%;border:1.5px solid #fff;flex:none;box-shadow:0 0 0 .5px #0003}
.pl.ride{font-size:12.5px}
.mk{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;border:0;padding:0;background:none;cursor:pointer}
.mk .pin{display:grid;place-items:center;min-width:28px;height:28px;padding:0 5px;border-radius:9px;color:#fff;font-weight:800;font-size:13px;
  border:2.5px solid #fff;box-shadow:0 2px 6px #0006}
.mk .ring{position:absolute;left:50%;top:50%;width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:50%;border:3px solid var(--accent);animation:ping 1.4s ease-out infinite;pointer-events:none}
.mk.sel .pin{transform:scale(1.2);outline:3px solid var(--accent);outline-offset:1px}
.mk .lab{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);white-space:nowrap;background:var(--ink);color:#fff8ec;
  font-size:12.5px;font-weight:700;padding:4px 8px;border-radius:8px;box-shadow:0 2px 6px #0005;display:none}
.mk.sel .lab{display:block}
.mk .ea{display:none;position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;text-align:center;font-size:13px;line-height:1;color:var(--accent);pointer-events:none}
.mk.edge{opacity:.92}
.mk.edge .ea{display:block}
.mk.edge .ring{display:none}
.mk.edge .pin{transform:scale(.85)}
.mk .st{position:absolute;right:-5px;top:-5px;width:12px;height:12px;border-radius:50%;border:2px solid #fff}
@keyframes ping{0%{transform:scale(.8);opacity:1}100%{transform:scale(2.4);opacity:0}}
/* 내 위치 */
#me{position:absolute;left:0;top:0;pointer-events:none;display:none}
#me .acc{position:absolute;border-radius:50%;background:#2f6ff012;border:1px solid #2f6ff033;transform:translate(-50%,-50%)}
#me .glow{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;
  background:radial-gradient(circle,#2f6ff0aa 0,#2f6ff055 30%,#2f6ff022 55%,#2f6ff010 75%,#2f6ff000 100%)}
#me .hd{position:absolute;left:0;top:0;width:0;height:0;display:none;transition:transform .15s linear}
#me .hd::before{content:"";position:absolute;left:-10px;top:-33px;width:20px;height:16px;background:#fff;clip-path:polygon(50% 0,100% 100%,0 100%);filter:drop-shadow(0 0 1px #0004)}
#me .hd::after{content:"";position:absolute;left:-6.5px;top:-29.5px;width:13px;height:10.5px;background:#2f6ff0;clip-path:polygon(50% 0,100% 100%,0 100%)}
#me .dotme{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:#2f6ff0;border:4px solid #fff;box-shadow:0 1px 6px #0005}
.zoombar{position:absolute;right:10px;bottom:22px;display:flex;flex-direction:column;gap:6px;z-index:5}
.zoombar button{width:42px;height:42px;border-radius:12px;border:0;background:#fffdf8;box-shadow:0 2px 6px #0003;font-size:20px;font-weight:700}
.zoombar button.small{font-size:12px}
.zoombar #locBtn{background:var(--me);color:#fff;font-size:12px;line-height:1.1}
.zoombar #locBtn.on{outline:3px solid #fff;box-shadow:0 0 0 5px #1a73e855}
.toast{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:#2b2118e6;color:#fff8ec;font-size:13px;padding:7px 12px;border-radius:10px;z-index:6;display:none;max-width:90%;text-align:center}
.legend{position:absolute;left:8px;bottom:20px;z-index:5;background:#fffdf8e6;border-radius:10px;padding:5px 8px;font-size:11px;color:var(--sub);line-height:1.5;box-shadow:0 1px 4px #0002}

/* 하단 패널 */
#panel{flex:none;height:19dvh;min-height:110px;max-height:82dvh;display:flex;flex-direction:column;background:var(--card);border-top:1px solid var(--line);
  border-radius:16px 16px 0 0;margin-top:-12px;position:relative;z-index:4;box-shadow:0 -4px 14px #0002;padding-bottom:env(safe-area-inset-bottom)}
#panel.anim{transition:height .22s ease}
.grip{width:100%;border:0;background:none;padding:9px 0 6px;display:grid;place-items:center;touch-action:none;cursor:ns-resize}
.grip i{display:block;width:40px;height:5px;border-radius:9px;background:#d5c8b2}
.tabs{display:flex;gap:4px;padding:0 12px 8px;touch-action:none}
.tab{flex:1;border:0;border-radius:10px;padding:8px;background:#f1e9da;color:var(--sub);font-size:14px;font-weight:700}
.tab.on{background:var(--ink);color:#fff8ec}
.list{flex:1;overflow-y:auto;padding:0 12px 14px;-webkit-overflow-scrolling:touch}
.hint{color:var(--sub);font-size:14px;line-height:1.6;padding:6px 4px}
.hint b{color:var(--ink)}
.banner{background:var(--warn-bg);color:var(--warn);font-size:13px;border-radius:10px;padding:8px 10px;margin:0 0 8px;line-height:1.5}
.card{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:14px;padding:10px 11px;margin-bottom:8px;cursor:pointer}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 2px #e4572e33}
.badge{flex:none;min-width:30px;height:30px;padding:0 6px;border-radius:9px;color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px}
.cbody{flex:1;min-width:0}
.cname{font-weight:800;font-size:15.5px;line-height:1.3}
.cmeta{font-size:12.5px;color:var(--sub);margin-top:2px}
.cloc{font-size:13px;margin-top:5px;line-height:1.45}
.cloc .em{font-weight:700}
.dist{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:13.5px;font-weight:800;color:var(--me)}
.dist .arr{display:inline-block;width:20px;height:20px;border-radius:50%;background:var(--me);color:#fff;font-size:13px;line-height:20px;text-align:center;transition:transform .2s}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:800;padding:3px 8px;border-radius:999px;margin-top:6px}
.pill.on{color:var(--on);background:var(--on-bg)}.pill.off{color:var(--off);background:var(--off-bg)}
.pill.warn{color:var(--warn);background:var(--warn-bg)}.pill.none{color:var(--none);background:var(--none-bg)}
.psub{font-size:12px;color:var(--sub);margin-left:6px}
.sec{font-size:13px;font-weight:800;color:var(--sub);margin:10px 2px 6px;display:flex;align-items:center;gap:6px}
.sec .cnt{font-weight:600}
.row{display:flex;align-items:center;gap:8px;padding:9px 4px;border-bottom:1px solid var(--line);font-size:14.5px}
.row .nm{flex:1;min-width:0}
.row .nm small{display:block;color:var(--sub);font-size:12px;margin-top:1px}
.row .go{flex:none;border:1px solid var(--line);background:#fff;border-radius:9px;padding:5px 8px;font-size:12.5px}
.row .go[disabled]{opacity:.45}
.star{flex:none;border:0;background:none;font-size:22px;line-height:1;padding:2px 2px;color:#c9b99c;cursor:pointer}
.star.on{color:#f2a900}
.row .pill{margin-top:0}
.filters{display:flex;gap:6px;margin:2px 0 4px;flex-wrap:wrap}
.filters .chip{color:var(--ink);border-color:var(--line);background:#fff}
.filters .chip.on{background:var(--ink);color:#fff8ec;border-color:var(--ink)}
</style>
</head>
<body>

<header>
  <div class="top">
    <h1>이월드 <span>길잡이</span></h1>
    <div class="live" id="live"><i class="dot"></i><span id="liveText">운영정보 확인 중</span><button id="refresh" type="button">새로고침</button><button id="testBtn" type="button">테스트</button></div>
  </div>
  <form class="search" id="searchForm" autocomplete="off">
    <input id="q" type="search" placeholder="어트랙션·장소 검색" enterkeyhint="search">
    <button type="button" id="clear">지우기</button>
  </form>
  <div class="chips" id="chips"></div>
</header>

<div id="viewport">

function hull(pts){
  pts=pts.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
  const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);
  const lo=[],up=[];
  for(const p of pts){ while(lo.length>=2&&cr(lo[lo.length-2],lo[lo.length-1],p)<=0) lo.pop(); lo.push(p); }
  for(const p of pts.slice().reverse()){ while(up.length>=2&&cr(up[up.length-2],up[up.length-1],p)<=0) up.pop(); up.push(p); }
  return lo.slice(0,-1).concat(up.slice(0,-1));
}

const vp=$('#viewport'), stage=$('#stage'), mkLayer=$('#markers'), lbLayer=$('#labels'), meEl=$('#me');
const RATIO = VB.h/VB.w;
let bw=0, bh=0, S=1, TX=0, TY=0;
const MIN_S=1, MAX_S=10;

function layout(keepCenter){
  const vw=vp.clientWidth, vh=vp.clientHeight;
  let cx=null, cy=null;
  if(keepCenter && bw){ cx=(vw/2-TX)/(bw*S); cy=(vh/2-TY)/(bh*S); }
  bw=vw; bh=vw*RATIO;
  stage.style.width=bw+'px'; stage.style.height=bh+'px';
  if(cx!=null){ TX=vw/2-cx*bw*S; TY=vh/2-cy*bh*S; clamp(); apply(); }
  else homeView(false);
}
function homeView(animate){
  // 이월드 부분(지도 가운데)이 화면을 채우도록
  const vw=vp.clientWidth, vh=vp.clientHeight;
  const x0=(90-VB.x)/VB.w, x1=(760-VB.x)/VB.w, y0=(70-VB.y)/VB.h, y1=(840-VB.y)/VB.h;
  const s=Math.max(MIN_S,Math.min(vw/((x1-x0)*bw), vh/((y1-y0)*bh)));
  const tx=vw/2-(x0+x1)/2*bw*s, ty=vh/2-(y0+y1)/2*bh*s;
  if(animate) animateTo(s,tx,ty); else { S=s;TX=tx;TY=ty;clamp();apply(); }
}
function clamp(){
  const vw=vp.clientWidth, vh=vp.clientHeight, w=bw*S, h=bh*S, m=0;
  if(w<=vw) TX=(vw-w)/2; else TX=Math.min(m,Math.max(vw-w-m,TX));
  if(h<=vh) TY=(vh-h)/2; else TY=Math.min(m,Math.max(vh-h-m,TY));
}
function apply(){
  stage.style.transform=`translate(${TX}px,${TY}px) scale(${S})`;
  placeOverlay();
}
function toScreen(px,py){ return [TX+((px-VB.x)/VB.w)*bw*S, TY+((py-VB.y)/VB.h)*bh*S]; }
let anim=null;
function animateTo(tS,tX,tY,ms=380){
  cancelAnimationFrame(anim);
  const s0=S,x0=TX,y0=TY,t0=performance.now();
  const sv=[S,TX,TY]; S=tS;TX=tX;TY=tY;clamp();tX=TX;tY=TY;[S,TX,TY]=sv;
  const step=now=>{
    const k=Math.min(1,(now-t0)/ms), e=1-Math.pow(1-k,3);
    S=s0+(tS-s0)*e; TX=x0+(tX-x0)*e; TY=y0+(tY-y0)*e; apply();
    if(k<1) anim=requestAnimationFrame(step);
  };
  anim=requestAnimationFrame(step);
}
function focusNorm(nx,ny,scale){
  const vw=vp.clientWidth, vh=vp.clientHeight;
  const s=Math.min(MAX_S,Math.max(MIN_S,scale));
  animateTo(s, vw/2-nx*bw*s, vh/2-ny*bh*s);
}
function focusPx(px,py,scale){ focusNorm((px-VB.x)/VB.w,(py-VB.y)/VB.h,scale); }
function fitPx(pts){
  if(!pts.length) return;
  if(pts.length===1) return focusPx(pts[0][0],pts[0][1],Math.max(S,4.5));
  const xs=pts.map(p=>p[0]), ys=pts.map(p=>p[1]);
  const x0=Math.min(...xs)-25,x1=Math.max(...xs)+25,y0=Math.min(...ys)-25,y1=Math.max(...ys)+25;
  const vw=vp.clientWidth, vh=vp.clientHeight;
  const s=Math.min(6,Math.max(MIN_S,Math.min(vw/((x1-x0)/VB.w*bw), vh/((y1-y0)/VB.h*bh))));
  focusPx((x0+x1)/2,(y0+y1)/2,s);
}

const ptrs=new Map(); let g=null, moved=false;
vp.addEventListener('pointerdown',e=>{
  if(e.target.closest('.zoombar')) return;
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  cancelAnimationFrame(anim); startGesture(); moved=false; vp.classList.add('drag');
});
window.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId)) return;
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const r=vp.getBoundingClientRect(), pts=[...ptrs.values()];
  if(pts.length===1 && g.n===1){
    const dx=pts[0].x-g.x, dy=pts[0].y-g.y;
    if(Math.abs(dx)+Math.abs(dy)>6) moved=true;
    TX=g.tx+dx; TY=g.ty+dy; clamp(); apply();
  } else if(pts.length>=2 && g.n>=2){
    moved=true;
    const d=Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y);
    const mx=(pts[0].x+pts[1].x)/2-r.left, my=(pts[0].y+pts[1].y)/2-r.top;
    const ns=Math.min(MAX_S,Math.max(MIN_S,g.s*d/g.d));
    const ix=(g.mx-g.tx)/g.s, iy=(g.my-g.ty)/g.s;
    S=ns; TX=mx-ix*S; TY=my-iy*S; clamp(); apply();
  }
});
function endPtr(e){ if(!ptrs.has(e.pointerId)) return; ptrs.delete(e.pointerId); if(ptrs.size) startGesture(); else vp.classList.remove('drag'); }
window.addEventListener('pointerup',endPtr);
window.addEventListener('pointercancel',endPtr);
function startGesture(){
  const r=vp.getBoundingClientRect(), pts=[...ptrs.values()];
  g={n:pts.length,tx:TX,ty:TY,s:S,x:pts[0]?.x,y:pts[0]?.y};
  if(pts.length>=2){ g.d=Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y)||1; g.mx=(pts[0].x+pts[1].x)/2-r.left; g.my=(pts[0].y+pts[1].y)/2-r.top; }
}
function zoomAround(ns,px,py,ms){ ns=Math.min(MAX_S,Math.max(MIN_S,ns)); const ix=(px-TX)/S, iy=(py-TY)/S; if(ms) animateTo(ns,px-ix*ns,py-iy*ns,ms); else { S=ns;TX=px-ix*S;TY=py-iy*S;clamp();apply(); } }
vp.addEventListener('wheel',e=>{ e.preventDefault(); const r=vp.getBoundingClientRect(); zoomAround(S*Math.exp(-e.deltaY*0.0018), e.clientX-r.left, e.clientY-r.top); },{passive:false});
let lastTap=0;
vp.addEventListener('click',e=>{

    setFakeMe(VB.x+(x-TX)/(bw*S)*VB.w, VB.y+(y-TY)/(bh*S)*VB.h); }
  if(t-lastTap<320){ const r=vp.getBoundingClientRect(); zoomAround(S*2,e.clientX-r.left,e.clientY-r.top,260); lastTap=0; } else lastTap=t;
});

function placeOverlay(){

let ME=null, watchId=null, heading=null, firstFix=true;
/* 테스트 모드: 주소 끝에 #test 를 붙이면 GPS 대신 지도를 누른 곳이 내 위치가 됨 */
let TEST=/test/i.test(location.hash||'')||/[?&]test/i.test(location.search||'');
/* 걷기 테스트: 주소 끝에 #walk 를 붙이면 지금 서 있는 곳을 이월드 정문으로 옮겨서, 실제로 걸으면 지도 위 점도 같은 거리·방향으로 움직임 */
let WALK=/walk/i.test(location.hash||'')||/[?&]walk/i.test(location.search||'');
let walkOff=null;
function setFakeMe(px,py){
  const [lat,lng]=px2ll(px,py); ME={lat,lng,acc:8,px,py}; snapMe(); placeOverlay(); updateDistances();
  if(chip && tab==='search'){ shown=chipPlaces(chip).slice(0,60); drawMarkers(); render(); }
}
function placeMe(){
  if(!ME){ meEl.style.display='none'; return; }
  const D=DISP||ME; const [x,y]=toScreen(D.px,D.py);
  meEl.style.display='block'; meEl.style.left=x+'px'; meEl.style.top=y+'px';

/* 화살표가 359°→0°로 넘어갈 때 한 바퀴 돌지 않도록 */
let _hdShown=null;
function shownHeading(h){
  if(_hdShown==null){ _hdShown=h; return h; }
  let d=((h-_hdShown)%360+540)%360-180; _hdShown+=d; return _hdShown;
}
/* 나침반: 아이폰은 화면을 터치했을 때만 허락 창을 띄울 수 있음 */
let compassAsked=false;
function askCompass(){
  if(compassAsked) return;
  try{
    if(typeof DeviceOrientationEvent!=='undefined' && typeof DeviceOrientationEvent.requestPermission==='function'){
      DeviceOrientationEvent.requestPermission().then(r=>{ if(r==='granted'){ compassAsked=true; listenCompass(); } }).catch(()=>{});
    } else { compassAsked=true; listenCompass(); }
  }catch(e){}
}
['click','touchend'].forEach(ev=>document.addEventListener(ev,askCompass,{capture:true}));
// 안드로이드 등 허락이 필요 없는 기기는 바로 시작
/* 내 위치 버튼: 내 위치로 다시 이동 */
function goMe(){
  askCompass();
  if(ME){
    const inside = ME.px>60 && ME.px<800 && ME.py>50 && ME.py<880;
    if(inside) focusPx(ME.px,ME.py,Math.max(S,3));
    else { const d=distM(ME.lat,ME.lng,...px2ll(420,450)); toast(`위치는 잘 잡혔어요. 지금은 이월드 밖이에요 (이월드까지 약 ${fmtDist(d)})`,4500); }
    return;
  }
  if(watchId==null) startGPS(true);
  toast('위치를 찾는 중이에요…');
}
/* 페이지를 열면 자동으로 내 위치 표시 시작 */
function startGPS(fromButton){
  if(TEST && !ME) setFakeMe(168,195);
  if(!('geolocation' in navigator)){ if(fromButton) toast('이 기기에서는 위치 기능을 쓸 수 없어요.'); return; }
  if(watchId!=null) return;
  let gpsErrShown=false, lastGood=null, walkStart=performance.now();
  $('#locBtn').classList.add('on');
  const onPos=pos=>{
    if(TEST) return; // 지도 누르기 테스트 중에는 실제 GPS 무시
    const {latitude:lat,longitude:lng,accuracy:acc0}=pos.coords, acc=acc0||50, now=performance.now();
    // 방금 받은 정확한 위치보다 훨씬 부정확한 값이 끼어들면 무시 (점이 튀는 것 방지)
    if(lastGood && acc>Math.max(40,lastGood.acc*2.5) && now-lastGood.t<15000) return;
    if(!lastGood || acc<=Math.max(40,lastGood.acc*2.5) ) lastGood={acc,t:now};
    let [px,py]=ll2px(lat,lng), mlat=lat, mlng=lng;
    if(WALK){
      // 처음 몇 초 동안은 더 정확한 위치가 오면 기준을 다시 잡음
      const reanchor = walkOff && walkOff.acc>acc*1.8 && now-walkStart<20000;
      if(!walkOff || reanchor){
        if(!walkOff) toast('걷기 테스트: 지금 서 있는 곳을 이월드 정문으로 놓았어요. 걸으면 파란 점이 같이 움직여요',5000);
        walkOff=[168-px,195-py]; walkOff.acc=acc;
      }
      px+=walkOff[0]; py+=walkOff[1]; [mlat,mlng]=px2ll(px,py);
    }
    ME={lat:mlat,lng:mlng,acc,px,py};
    if(pos.coords.heading!=null && !isNaN(pos.coords.heading) && pos.coords.speed>0.7 && compassSrc!=='device') heading=pos.coords.heading;
    const inside = px>60 && px<800 && py>50 && py<880;
    if(firstFix){
      firstFix=false; snapMe();
      if(inside) focusPx(px,py,Math.max(S,WALK?5:3));
      else { const d=distM(ME.lat,ME.lng,...px2ll(420,450)); toast(`위치는 잘 잡혔어요. 지금은 이월드 밖이에요 (이월드까지 약 ${fmtDist(d)})`,4500); }
    }
    glideMe(); updateDistances();
  };
  const onErr=err=>{
    if(err.code===3 && ME) return; // 이미 위치가 있으면 시간초과는 조용히 넘김
    const msg={1:'위치 권한이 꺼져 있어요. 브라우저 설정에서 위치를 허용해 주세요.',2:'위치를 찾지 못했어요. 밖으로 나가면 더 잘 잡혀요.',3:'위치 찾는 데 시간이 걸리고 있어요. 실내보다 밖에서 더 빨라요.'}[err.code]||'위치를 가져오지 못했어요.';
    if(!gpsErrShown || fromButton){ toast(msg,3500); gpsErrShown=true; }
    if(err.code===1){ navigator.geolocation.clearWatch(watchId); watchId=null; $('#locBtn').classList.remove('on'); }
  };

function distM(la1,lo1,la2,lo2){
  const R=6371000, t=Math.PI/180, dla=(la2-la1)*t, dlo=(lo2-lo1)*t;
  const a=Math.sin(dla/2)**2+Math.cos(la1*t)*Math.cos(la2*t)*Math.sin(dlo/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}
function bearing(la1,lo1,la2,lo2){
  const t=Math.PI/180, y=Math.sin((lo2-lo1)*t)*Math.cos(la2*t), x=Math.cos(la1*t)*Math.sin(la2*t)-Math.sin(la1*t)*Math.cos(la2*t)*Math.cos((lo2-lo1)*t);
  return (Math.atan2(y,x)/t+360)%360;
}

  return new Promise((res,rej)=>{
    const cb='__ew'+Date.now()+Math.floor(Math.random()*1e4);
    const s=document.createElement('script');
    const timer=setTimeout(()=>{cleanup();rej(new Error('시간 초과'))},15000);
    function cleanup(){clearTimeout(timer);delete window[cb];s.remove();}
    window[cb]=d=>{cleanup();res(d)};
    s.onerror=()=>{cleanup();rej(new Error('불러오기 실패'))};
    s.src=url+(url.includes('?')?'&':'?')+'callback='+cb;
    document.head.appendChild(s);

}

function matchApi(){
  for(const k in API_OF) delete API_OF[k];
  for(const k in PLACE_OF) delete PLACE_OF[k];
  if(!LIVE) return;
  const cands=PLACES.filter(p=>p.live), pairs=[];
  LIVE.items.forEach(it=>{
    const n=norm(it.name), z=norm(it.zone); if(n.length<2) return;
    cands.forEach(p=>{
      let best=0;
      [p.name,...p.alias].forEach(k=>{
        k=norm(k); if(k.length<2) return;
        let sc=0;
        if(k===n) sc=100; else if(n.includes(k)||k.includes(n)) sc=60-Math.abs(n.length-k.length);
        if(sc>best) best=sc;
      });
      if(best>0 && z && norm(ZONES[p.zone].name)===z) best+=15;
      if(best>=35) pairs.push({it,p,sc:best});
    });
  });
  pairs.sort((a,b)=>b.sc-a.sc);
  pairs.forEach(({it,p})=>{ if(API_OF[p.id] || PLACE_OF[it.id]!=null) return; API_OF[p.id]=it; PLACE_OF[it.id]=p.id; });
}
function apiOfPlace(p){ return API_OF[p.id] || (p.ref && API_OF[p.ref]) || null; }
function statusOf(a){
  if(!a) return null;
  if(a.isEnabled===false) return {k:'off',label:'운휴',sub:''};
  const t=a.today; if(!t) return {k:'none',label:'오늘 정보 없음',sub:''};
  const subs=[];
  if(t.start&&t.end) subs.push(`${hm(t.start)}~${hm(t.end)}`);
  if(t.wait!=null && t.wait!=='') subs.push('대기 '+t.wait+(/^\d+$/.test(String(t.wait))?'분':''));
  if(t.restart) subs.push(hm(t.restart)+' 재개 예정');
  if(t.memo) subs.push(t.memo);
  const s=String(t.current||t.close||'').trim();
  let k,label;
  if(s){ label=s; if(/운휴|중지|점검|마감|종료|불가|중단|휴장/.test(s)) k='off'; else if(/운영|정상|가능|오픈|open/i.test(s)) k='on'; else k='warn'; }
  else if(t.desired===false){ k='off'; label='운휴'; }
  else if(t.desired===true){ k='on'; label='운영'; }
  else { k='none'; label='확인 필요'; }
  if(k==='on' && t.start && t.end){ const now=nowKST(); if(now<hm(t.start)){ k='warn'; label=`운영 전 (${hm(t.start)} 시작)`; } else if(now>hm(t.end)){ k='off'; label='오늘 운영 종료'; } }
  if(a.stale) subs.push('오늘 자료 아직 없음');
  return {k,label,sub:subs.join(' · ')};
}
function statusOfPlace(p){
  if(!p.live && !p.ref) return null;
  if(!LIVE) return null;
  const a=apiOfPlace(p);
  if(!a) return p.live ? {k:'none',label:'홈페이지 목록에 없음',sub:''} : null;
  return statusOf(a);
}

function searchPlaces(q){
  const n=norm(q); if(!n) return [];
  const res=[];
  SEARCHABLE.forEach(p=>{
    const name=norm(p.name); let sc=0;
    if(name===n) sc=100; else if(name.startsWith(n)) sc=85; else if(name.includes(n)) sc=70;
    if(!sc && p.alias.some(a=>norm(a)===n)) sc=75;
    if(!sc && p.alias.some(a=>norm(a).includes(n)||(n.length>=2&&norm(a).length>=2&&n.includes(norm(a))))) sc=55;
    if(!sc && norm(CATS[p.cat].words).includes(n)) sc=40;
    if(!sc && norm(ZONES[p.zone].name).includes(n)) sc=30;
    if(!sc && p.note && norm(p.note).includes(n)) sc=25;
    const a=apiOfPlace(p); if(!sc && a && a.detail && norm(a.detail).includes(n)) sc=20;
    if(sc) res.push({p,sc});
  });
  res.sort((a,b)=>b.sc-a.sc || nearSort(a.p,b.p));
  return res.map(r=>r.p);
}

      <button type="button" class="chip ${sf==='fav'?'on':''}" data-f="fav">★ 즐겨찾기 ${favCnt}</button>
      <button type="button" class="chip ${sf==='off'?'on':''}" data-f="off">운휴·종료만 ${offs}</button></div>
      <div class="hint" style="padding:2px 4px 0;font-size:12.5px">이월드 홈페이지 어트랙션 목록 · ${esc((LIVE.fetchedAt||'').slice(5,16).replace('T',' '))} 기준</div>`;
    const groups={};
    items.filter(x=> sf==='all' || (sf==='off'&&x.st.k==='off') || (sf==='fav'&&isFav(x)))
      .forEach(x=>{(groups[x.a.zone||'기타']=groups[x.a.zone||'기타']||[]).push(x)});
    const order=['판타지월드','다이나믹월드','어드벤처월드','매직월드'];
    Object.keys(groups).sort((a,b)=>(order.indexOf(a)+99)%99-(order.indexOf(b)+99)%99).forEach(z=>{
      h+=`<div class="sec">${esc(z)} <span class="cnt">${groups[z].length}</span></div>`;
      groups[z].forEach(({a,st,pid})=>{
        const fk=favKeyApi(a), fc=FAVS[fk];
        h+=`<div class="row"><button type="button" class="star${fc?' on':''}" data-k="${fk}" data-n="${esc(a.name)}" aria-label="즐겨찾기" style="${fc?`color:${fc}`:''}">${fc?'★':'☆'}</button>
          <div class="nm">${esc(a.name)}<small>${esc(a.detail||'')}${st.sub?(a.detail?' · ':'')+esc(st.sub):''}</small></div>
          <span class="pill ${st.k}">${esc(st.label)}</span>
          <button type="button" class="go" data-pid="${pid?canon(pid):''}" ${pid?'':'disabled'}>${pid?'지도':'위치 미등록'}</button></div>`;
      });
    });
    if(sf==='fav' && otherFavs.length){
      h+=`<div class="sec">그 밖의 즐겨찾기 <span class="cnt">${otherFavs.length}</span></div>`;
      otherFavs.forEach(p=>{
        const fk='p:'+p.id, fc=FAVS[fk];
        h+=`<div class="row"><button type="button" class="star on" data-k="${fk}" data-n="${esc(p.name)}" style="color:${fc}">★</button>
          <div class="nm">${esc(p.name)}<small>${esc(ZONES[p.zone].name)}${p.num&&p.zone!=='T'?' '+esc(p.num)+'번':''}${p.note?' · '+esc(p.note):''}</small></div>
          <button type="button" class="go" data-pid="${p.id}">지도</button></div>`;
      });
    }
    if(!Object.keys(groups).length && !(sf==='fav'&&otherFavs.length)) h+= sf==='fav'
      ? '<div class="hint">☆를 누르면 즐겨찾기에 추가돼요. 검색 결과에서도 추가할 수 있어요.</div>'
      : '<div class="hint">해당하는 어트랙션이 없어요.</div>';
    L.innerHTML=h;
    L.querySelectorAll('.filters .chip').forEach(b=>b.onclick=()=>{sf=b.dataset.f; saveLS('ew_sf',sf); render();});
    L.querySelectorAll('.star').forEach(b=>b.onclick=()=>openFavPicker(b.dataset.k,b.dataset.n));
    L.querySelectorAll('.go[data-pid]').forEach(b=>b.onclick=()=>{
      const id=b.dataset.pid; if(!id) return;
      chip=null; query=BY_ID[id].name; $('#q').value=query; drawChips();
      shown=[BY_ID[id]]; selId=id; drawMarkers(); setTab('search'); select(id,false,false); setPanel('min');
    });
  }
}

/* 입력 */
function drawChips(){
  $('#chips').innerHTML=CHIP_LIST.map(c=>`<button type="button" class="chip${chip===c.key?' on':''}" data-k="${c.key}">${c.label}</button>`).join('');
  $('#chips').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{
    chip = chip===b.dataset.k ? null : b.dataset.k;
    query=''; $('#q').value=''; drawChips();
    if(chip) runSearch(); else { shown=[]; drawMarkers(); render(); }
  });
}
let typingTimer;
$('#q').addEventListener('input',e=>{ clearTimeout(typingTimer); typingTimer=setTimeout(()=>{ query=e.target.value.trim(); chip=null; drawChips(); runSearch(true); },350); });
$('#searchForm').addEventListener('submit',e=>{ e.preventDefault(); query=$('#q').value.trim(); chip=null; drawChips(); runSearch(true); $('#q').blur(); });
$('#clear').onclick=()=>{ query=''; chip=null; $('#q').value=''; drawChips(); shown=[]; selId=null; drawMarkers(); render(); homeView(true); };

/* 시작 */
buildLabels();
buildFavStars();
drawChips();
layout(false);
render();
/* 테스트 메뉴 */
function testState(){ return TEST?'tap':(WALK?'walk':'off'); }
function setTestMode(m){
  TEST = m==='tap'; WALK = m==='walk'; walkOff=null;
  $('#testBtn').classList.toggle('on',m!=='off');
  $('#testBtn').textContent = m==='off' ? '테스트' : '테스트 중';
  if(m==='tap'){ setFakeMe(168,195); focusPx(168,195,Math.max(S,4)); toast('지도를 한 번 누르면 그 자리로 내 위치가 옮겨져요. 몸을 돌리면 화살표가 따라 돌아요',4500); }
  else { ME=null; DISP=null; firstFix=true; placeOverlay(); updateDistances();
    if(watchId!=null){ navigator.geolocation.clearWatch(watchId); watchId=null; } startGPS(true); // 다시 시작해서 바로 현재 위치 받기
    if(m==='walk') toast('위치를 잡는 중이에요… 잡히면 지금 서 있는 곳이 이월드 정문이 돼요',4000);
    else toast('테스트를 끝냈어요. 실제 위치로 돌아왔어요',2500); }
  if(chip && tab==='search'){ shown=chipPlaces(chip).slice(0,60); drawMarkers(); render(); }
}
$('#testBtn').onclick=()=>{
  askCompass();
  const cur=testState(), box=$('#favPicker');
  box.innerHTML=`<div class="fpbox"><div class="fpn">테스트</div><div class="tmi">
    <button type="button" data-m="tap" class="${cur==='tap'?'on':''}">지도 누르기 테스트<small>정문에 가상의 내 위치가 생겨요. 지도를 누르면 그 자리로 옮겨지고, 몸을 돌리면 방향 화살표를 확인할 수 있어요.</small></button>
    <button type="button" data-m="walk" class="${cur==='walk'?'on':''}">걷기 테스트<small>지금 서 있는 곳을 이월드 정문으로 놓아요. 실제로 걸으면 파란 점도 같은 거리·방향으로 움직여요.</small></button>
    <button type="button" data-m="off" class="${cur==='off'?'on':''}">테스트 끝내기<small>실제 내 위치로 돌아가요.</small></button>
  </div><div class="fpb"><button type="button" class="fpx">닫기</button></div></div>`;
  box.style.display='flex';
  const close=()=>{ box.style.display='none'; };
  box.onclick=e=>{ if(e.target===box) close(); };
  box.querySelector('.fpx').onclick=close;
  box.querySelectorAll('.tmi button').forEach(b=>b.onclick=()=>{ close(); setTestMode(b.dataset.m); });
};
if(TEST||WALK){ $('#testBtn').classList.add('on'); $('#testBtn').textContent='테스트 중'; }
listenCompass(); // 허락이 필요 없는 기기(안드로이드 등)는 바로 방향 받기 시작
startGPS(false);
loadLive(false);
setInterval(()=>{ if(!document.hidden) loadLive(false); }, AUTO_REFRESH_MIN*60*1000);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden && LIVE){ const age=Date.now()-new Date(LIVE.fetchedAt).getTime(); if(age>AUTO_REFRESH_MIN*60*1000) loadLive(false);} });
</script>
</body>
</html>
